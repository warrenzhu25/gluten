# -*- protobuffer -*-
# proto-file: google3/devtools/kokoro/config/proto/build.proto
# proto-message: BuildConfig
# Location of the bash script. Should have value <git_on_borg_scm.name>/<path_from_repository_root>.
# git_on_borg_scm.name is specified in the job configuration (next section).
timeout_mins: 1080
env_vars {
  key: "OS_VERSION"
  value: "Debian12"
}
env_vars {
  key: "GLUTEN_BRANCH"
  value: "dataproc-branch-1.4"
}
env_vars {
  key: "VELOX_BRANCH"
  value: "dataproc-branch-1.4"
}
env_vars {
  key: "PUBLISH_JARS_TO_AR"
  value: "no"
}
env_vars {
  key: "PUBLISH_JARS_TO_GCS"
  value: "yes"
}
build_file: "incubator-gluten/kokoro/kokoro_release_s8s_2.2.sh"